{% extends 'base.html' %}
{% block content %}

<h1 class="mt-4 mb-4">Job Application Form</h1>
<form method="POST" action="{% url 'index' %}">
    {% csrf_token %}
    <div class="form-group">
        <div class="mb-3">
            <label for="first_name">First Name:</label>
            <input type="text" id="first_name" name="first_name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="last_name">Last Name:</label>
            <input type="text" id="last_name" name="last_name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="date">Available start date:</label>
            <input type="date" id="date" name="date" class="form-control" data-format="dd-MM-yyyy" required>
        </div>
        <div class="mb-3">
            <label>Current occupation:</label>
            <br>
            <div class="btn-group-vertical" id="occupation">
                <input type="radio" id="employed" name="occupation" value="employed" class="btn-check form-check-input" required>
                <label class="btn btn-outline-secondary" for="employed">Employed:</label>

                <input type="radio" id="unemployed" name="occupation" value="unemployed" class="btn-check form-check-input" required>
                <label class="btn btn-outline-secondary" for="unemployed">Unemployed:</label>

                <input type="radio" id="self-employed" name="occupation" value="self-employed" class="btn-check form-check-input" required>
                <label class="btn btn-outline-secondary" for="self-employed">Self-employed:</label>

                <input type="radio" id="student" name="occupation" value="student" class="btn-check form-check-input" required>
                <label class="btn btn-outline-secondary" for="student">Student:</label>
            </div>
        </div>
    </div>
    <button type="submit" class="btn btn-primary mt-3">Submit</button>

</form>
{% endblock %}
